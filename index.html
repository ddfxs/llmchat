<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudflare Pages LLM Chat</title>

  <!-- 项目样式 -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Markdown 渲染库（A2）：marked 轻量、无依赖 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- ================= 登录层（C1 鉴权） ================= -->
  <div id="loginOverlay" class="overlay">
    <div class="login-card">
      <h2>🔐 请输入访问密码</h2>
      <p class="login-hint">密码与后端环境变量 AUTH_PASS 一致</p>
      <input id="loginPass" type="password" placeholder="访问密码" autocomplete="current-password" />
      <button id="btnLogin">进入</button>
      <p id="loginError" class="error"></p>
    </div>
  </div>

  <!-- ================= 主应用（登录后显示） ================= -->
  <div id="app" class="hidden">

    <!-- 左侧：会话列表（A7 多会话 / D1 持久化） -->
    <aside id="sidebar">
      <div class="side-head">
        <button id="btnNewSession" class="primary">＋ 新会话</button>
      </div>
      <div id="sessionList" class="session-list"></div>
      <div class="side-foot">
        <button id="btnStats">📊 用量统计</button>
        <button id="btnExport">⬇ 导出对话</button>
      </div>
    </aside>

    <!-- 右侧：主聊天区 -->
    <main id="main">
      <!-- 顶部工具栏：模型切换（B1）/ 主题（A2）/ 清空（A8）/ 退出 -->
      <header id="toolbar">
        <select id="modelSelect" title="选择模型"></select>
        <button id="btnTheme" title="切换主题">🌙</button>
        <button id="btnClear" title="清空当前会话">🗑 清空</button>
        <button id="btnLogout" title="退出登录">退出</button>
      </header>

      <!-- 聊天消息区 -->
      <div id="chat">
        <!--
          消息由 js/app.js 动态渲染，结构为：
          <div class="msg user"><div class="bubble">...</div></div>
          <div class="msg bot"  ><div class="bubble md"></div>
                                   <button class="copy">复制</button></div>
        -->
      </div>

      <!-- 底部输入栏 -->
      <form id="form" class="inputbar">
        <textarea id="input" rows="1" placeholder="输入你的问题…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="btnSend" type="submit">发送</button>
      </form>
    </main>
  </div>

  <!-- ================= 用量统计弹窗（D2） ================= -->
  <div id="statsModal" class="overlay hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3>📊 用量统计</h3>
        <button id="btnCloseStats">✕</button>
      </div>
      <div id="statsBody"><!-- 由 app.js 填充 --></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
